name: Universal AI Issue Runner (Self-Hosted)

# Attivazione flessibile:
# 1. Quando viene aperta un'Issue
# 2. Quando viene aggiunto un commento a un'Issue
# 3. Quando viene aggiunto un commento di review a una PR
# 4. Tramite dispatch manuale
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      agent:
        description: "Agente AI da eseguire (agy, claude, opencode, pi)"
        required: true
        default: "agy"
      prompt:
        description: "Istruzione da eseguire"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ai-agent:
    # Si attiva se viene menzionato uno dei comandi agentici nel commento/issue
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '/agy') ||
         contains(github.event.issue.body, '/antigravity') ||
         contains(github.event.issue.body, '/claude') ||
         contains(github.event.issue.body, '/oc') ||
         contains(github.event.issue.body, '/opencode') ||
         contains(github.event.issue.body, '/pi'))) ||
      (github.event_name != 'issues' &&
        github.event.comment.user.login != 'github-actions[bot]' &&
        (contains(github.event.comment.body, '/agy') ||
         contains(github.event.comment.body, '/antigravity') ||
         contains(github.event.comment.body, '/claude') ||
         contains(github.event.comment.body, '/oc') ||
         contains(github.event.comment.body, '/opencode') ||
         contains(github.event.comment.body, '/pi')))

    # 🎯 IL PUNTO CHIAVE: esegue sul runner registrato su questa macchina!
    runs-on: [self-hosted, issue-runner]
    timeout-minutes: 120

    env:
      GH_API: "https://api.github.com"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      COMMENT_BODY: ${{ github.event.comment.body || github.event.issue.body || github.event.inputs.prompt }}
      COMMENT_AUTHOR: ${{ github.event.comment.user.login || github.event.issue.user.login || github.actor }}
      COMMENT_ID: ${{ github.event.comment.id }}
      IS_PR_EVENT: ${{ github.event_name == 'pull_request_review_comment' }}
      IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      RUN_NUMBER: ${{ github.run_number }}

    steps:
      # ── 1. Feedback immediato: aggiunta reazione 👀 ──────────────────────────
      - name: Reagisci al comando (👀)
        run: |
          API="$GH_API/repos/$REPO"
          if [ -n "$COMMENT_ID" ]; then
            RPATH="issues/comments/$COMMENT_ID/reactions"
          elif [ -n "$ISSUE_NUMBER" ]; then
            RPATH="issues/$ISSUE_NUMBER/reactions"
          fi
          if [ -n "$RPATH" ]; then
            curl -s -X POST "$API/$RPATH" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d '{"content":"eyes"}' > /dev/null || true
          fi

      # ── 2. Checkout repository ───────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurazione Git Identity
        run: |
          git config --global user.name "vibe-ai-bot"
          git config --global user.email "bot@vibe-maribit.local"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

      # ── 3. Riconoscimento Agente e Prompt ───────────────────────────────────
      - name: Determina Agente e Prompt
        id: setup
        run: |
          TEXT="$COMMENT_BODY"
          AGENT="agy"

          if [[ "$TEXT" =~ /claude ]]; then
            AGENT="claude"
            CLEAN_PROMPT=$(echo "$TEXT" | sed -e 's/\/claude//g')
          elif [[ "$TEXT" =~ /oc ]] || [[ "$TEXT" =~ /opencode ]]; then
            AGENT="opencode"
            CLEAN_PROMPT=$(echo "$TEXT" | sed -e 's/\/opencode//g' -e 's/\/oc//g')
          elif [[ "$TEXT" =~ /pi ]]; then
            AGENT="pi"
            CLEAN_PROMPT=$(echo "$TEXT" | sed -e 's/\/pi//g')
          else
            AGENT="agy"
            CLEAN_PROMPT=$(echo "$TEXT" | sed -e 's/\/antigravity//g' -e 's/\/agy//g')
          fi

          if [ "$IS_MANUAL" = "true" ]; then
            AGENT="${{ github.event.inputs.agent }}"
            CLEAN_PROMPT="${{ github.event.inputs.prompt }}"
          fi

          BRANCH="ai/issue-${ISSUE_NUMBER:-run-$RUN_NUMBER}-${AGENT}"
          echo "agent=$AGENT" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          
          # Salva prompt pulito su file per evitare problemi di escaping
          cat << 'EOF' > /tmp/agent_prompt.txt
          Risolvi la seguente richiesta:
          EOF
          echo "$CLEAN_PROMPT" >> /tmp/agent_prompt.txt
          if [ -n "$ISSUE_TITLE" ]; then
            echo -e "\nContesto Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}\n${ISSUE_BODY}" >> /tmp/agent_prompt.txt
          fi

      # ── 4. Preparazione Branch ──────────────────────────────────────────────
      - name: Crea / Checkout Branch Dedicato
        run: |
          BRANCH="${{ steps.setup.outputs.branch }}"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"

      # ── 5. Esecuzione Agente ────────────────────────────────────────────────
      - name: Esecuzione AI Agent
        run: |
          AGENT="${{ steps.setup.outputs.agent }}"
          PROMPT=$(cat /tmp/agent_prompt.txt)

          echo "🚀 Inizio esecuzione con Agente: $AGENT"

          case "$AGENT" in
            "agy")
              echo "🌟 Esecuzione Google Antigravity CLI (sottoscrizione Pro)..."
              agy --dangerously-skip-permissions --mode accept-edits -p "$PROMPT"
              ;;
            "claude")
              echo "🌟 Esecuzione Anthropic Claude Code..."
              claude -p "$PROMPT" --dangerously-skip-permissions
              ;;
            "opencode")
              echo "🌟 Esecuzione OpenCode CLI..."
              opencode run "$PROMPT"
              ;;
            "pi")
              echo "🌟 Esecuzione Pi Coding Agent..."
              pi -p "$PROMPT"
              ;;
            *)
              echo "❌ Agente sconosciuto: $AGENT, fallback ad agy"
              agy --dangerously-skip-permissions --mode accept-edits -p "$PROMPT"
              ;;
          esac

      # ── 6. Commit, Push e Creazione/Aggiornamento PR ──────────────────────────
      - name: Salva modifiche e Apri Pull Request
        id: pr
        run: |
          BRANCH="${{ steps.setup.outputs.branch }}"
          AGENT="${{ steps.setup.outputs.agent }}"

          # Verifica se ci sono modifiche nei file
          if [ -z "$(git status --porcelain)" ]; then
            echo "ℹ️ Nessuna modifica generata dall'agente."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          git add -A
          git commit -m "feat($AGENT): risoluzione automatica per Issue #${ISSUE_NUMBER}"
          git push -u origin "$BRANCH" --force

          # Crea o aggiorna la Pull Request tramite GitHub CLI
          PR_TITLE="🤖 [$AGENT] Fix Issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          PR_BODY="Modifiche generate in modo autonomo da **$AGENT** in esecuzione sul self-hosted runner locale.

- **Issue di riferimento**: #${ISSUE_NUMBER}
- **Richiesta originale**:
> ${COMMENT_BODY}

Verifica le modifiche e procedi con il merge se soddisfacente."

          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --head "$BRANCH" \
            --base "main" || echo "PR già esistente o aggiornata."

      # ── 7. Reazione Finale di successo (🚀) ──────────────────────────────────
      - name: Segnala Completamento (🚀)
        if: success()
        run: |
          API="$GH_API/repos/$REPO"
          if [ -n "$COMMENT_ID" ]; then
            RPATH="issues/comments/$COMMENT_ID/reactions"
          elif [ -n "$ISSUE_NUMBER" ]; then
            RPATH="issues/$ISSUE_NUMBER/reactions"
          fi
          if [ -n "$RPATH" ]; then
            curl -s -X POST "$API/$RPATH" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d '{"content":"rocket"}' > /dev/null || true
          fi
